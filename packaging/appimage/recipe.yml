version: 1

script:
  - rm -rf "$TARGET_APPDIR"
  - mkdir -p "$TARGET_APPDIR/usr/lib/resolve-ready"
  - mkdir -p "$TARGET_APPDIR/usr/share/applications"
  - mkdir -p "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/apps"
  - mkdir -p "$TARGET_APPDIR/usr/share/icons/hicolor/256x256/apps"
  - mkdir -p "$TARGET_APPDIR/usr/share/metainfo"
  - cp -a /src/src/resolve_ready "$TARGET_APPDIR/usr/lib/resolve-ready/"
  - find "$TARGET_APPDIR/usr/lib/resolve-ready" -name '__pycache__' -type d -prune -exec rm -rf {} +
  - find "$TARGET_APPDIR/usr/lib/resolve-ready" -name '*.pyc' -delete
  - install -Dm644 /src/assets/io.github.mdshakibsami.ResolveReady.desktop "$TARGET_APPDIR/usr/share/applications/io.github.mdshakibsami.ResolveReady.desktop"
  - install -Dm644 /src/assets/resolve-ready.svg "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/apps/resolve-ready.svg"
  - install -Dm644 /src/assets/resolve-ready.png "$TARGET_APPDIR/usr/share/icons/hicolor/256x256/apps/resolve-ready.png"
  - install -Dm644 /src/assets/io.github.mdshakibsami.ResolveReady.metainfo.xml "$TARGET_APPDIR/usr/share/metainfo/io.github.mdshakibsami.ResolveReady.metainfo.xml"
  - install -Dm644 /src/LICENSE "$TARGET_APPDIR/usr/share/doc/resolve-ready/copyright"
  - install -Dm755 /opt/ffmpeg-static/bin/ffmpeg "$TARGET_APPDIR/usr/bin/ffmpeg"
  - install -Dm755 /opt/ffmpeg-static/bin/ffprobe "$TARGET_APPDIR/usr/bin/ffprobe"
  - install -Dm644 /opt/ffmpeg-static/licenses/COPYING.LGPLv2.1 "$TARGET_APPDIR/usr/share/doc/resolve-ready/ffmpeg/COPYING.LGPLv2.1"
  - install -Dm644 /opt/ffmpeg-static/licenses/COPYING.LGPLv3 "$TARGET_APPDIR/usr/share/doc/resolve-ready/ffmpeg/COPYING.LGPLv3"

AppDir:
  path: ./AppDir
  app_info:
    id: io.github.mdshakibsami.ResolveReady
    name: ResolveReady
    icon: resolve-ready
    version: "{{VERSION}}"
    exec: usr/bin/python3
    exec_args: "-m resolve_ready $@"
  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] https://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] https://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] https://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - librsvg2-common
      - adwaita-icon-theme
      - hicolor-icon-theme
      - libgdk-pixbuf2.0-bin
      - gsettings-desktop-schemas
      # gdk-pixbuf consults the shared MIME database when identifying images.
      # It is normally excluded as a "system service", but without it every
      # image (including the icon theme) fails to decode.
      - shared-mime-info
      # ffmpeg and ffprobe are built as static LGPL binaries in the Dockerfile
      # and copied in by the script above.  They are intentionally not apt
      # packages: Ubuntu's ffmpeg is GPL and drags in a large GPU stack.
      # appimage-builder excludes the OpenGL dispatch stack on purpose: OpenGL
      # vendor drivers are tightly coupled to the host and to its glibc.  Keep
      # it that way so GTK uses the host's libEGL (NVIDIA, Mesa, etc.) instead
      # of mixing a jammy libglvnd with a much newer host driver.  The cairo
      # renderer below means the UI never depends on GPU acceleration anyway.
      # libwayland-egl is a hard NEEDED entry of libgtk, so it must be present.
      - libwayland-client0
      - libwayland-egl1
      - libwayland-server0
      - libwayland-cursor0
      - libx11-6
      - libx11-xcb1
      - libxext6
      - libxrender1
      - libxi6
      - libxcursor1
      - libxrandr2
      - libxfixes3
      - libxcomposite1
      - libxdamage1
      - libxinerama1
      - libxxf86vm1
      - libxtst6
      - libsm6
      - libice6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libxcb-render0
      - libxcb-shm0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxcb-dri2-0
      - libxcb-dri3-0
      - libxcb-glx0
      - libxcb-present0
      - libxcb-sync1
      - libxcb-randr0
      - libxcb-util1
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-xkb1
      - libxcb-xinput0
      - libfontconfig1
      - libfreetype6
    exclude:
      - python3-dev
      - python3-pip
      - man-db
  runtime:
    env:
      PYTHONHOME: "${APPDIR}/usr"
      PYTHONPATH: "${APPDIR}/usr/lib/resolve-ready"
      PYTHONNOUSERSITE: "1"
      GI_TYPELIB_PATH: "${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0"
      GSETTINGS_SCHEMA_DIR: "${APPDIR}/usr/share/glib-2.0/schemas"
      GDK_PIXBUF_MODULEDIR: "${APPDIR}/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders"
      GSK_RENDERER: "cairo"
      # The UI only needs the cairo renderer.  Hide host EGL vendors so that a
      # bundled GTK/pycaire never tries to load a newer NVIDIA/Mesa EGL driver
      # into the process; that mismatch is a reliable way to get a SIGSEGV.
      __EGL_VENDOR_LIBRARY_FILENAMES: "/dev/null"
      XDG_DATA_DIRS: "${APPDIR}/usr/share:/usr/local/share:/usr/share"

AppImage:
  arch: x86_64
  file_name: "ResolveReady-{{VERSION}}-x86_64.AppImage"
